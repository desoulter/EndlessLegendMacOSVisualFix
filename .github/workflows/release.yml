name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check release version
        run: |
          python - <<'PY'
          import os
          from elvisualfix import __version__
          assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__
          PY
      - run: python -m unittest discover -v
      - run: python tools/package_release.py
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --draft
          --title "Endless Legend macOS VisualFix ${GITHUB_REF_NAME}"
          --notes-file RELEASE_NOTES.md
          dist/EndlessLegendMacOSVisualFix-*.zip dist/SHA256SUMS
